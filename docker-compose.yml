services:
  travel-booking:
    build: .
    ports:
      - "5000:5000"
    environment:
      SECRET_KEY: change-this-secret
      DATABASE_URL: sqlite:////app/instance/Travelbookingsystem.db
    volumes:
      - travel_data:/app/instance
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  travel_data:
